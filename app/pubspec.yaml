name: emotioncall
description: "EmotionCall AI — realtime conversation emotion & intent analysis."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^3.0.1
  record: ^5.1.2
  fl_chart: ^0.69.0
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
